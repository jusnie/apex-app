name: Build APEX Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept all Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_FILE="$GITHUB_WORKSPACE/android/apex-release.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KS_FILE"
          else
            KS_PASS="apexrelease2026"
            KEY_ALIAS="apex"
            KEY_PASS="apexrelease2026"
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=APEX, OU=Mobile, O=Yasuda Gian, L=Manila, S=NCR, C=PH"
          fi
          cat > "$GITHUB_WORKSPACE/android/keystore.properties" <<EOF
          storeFile=$KS_FILE
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build Signed Release APK
        working-directory: android
        env:
          APEX_SYSTEM_DEFAULT_PROVIDER: ${{ secrets.APEX_SYSTEM_DEFAULT_PROVIDER }}
          APEX_SYSTEM_DEFAULT_VISION_MODEL: ${{ secrets.APEX_SYSTEM_DEFAULT_VISION_MODEL }}
          APEX_SYSTEM_DEFAULT_TEXT_MODEL: ${{ secrets.APEX_SYSTEM_DEFAULT_TEXT_MODEL }}
          APEX_SYSTEM_DEFAULT_SPEECH_PROVIDER: ${{ secrets.APEX_SYSTEM_DEFAULT_SPEECH_PROVIDER }}
          APEX_SYSTEM_GEMINI_API_KEY: ${{ secrets.APEX_SYSTEM_GEMINI_API_KEY }}
          APEX_SYSTEM_OPENAI_API_KEY: ${{ secrets.APEX_SYSTEM_OPENAI_API_KEY }}
          APEX_SYSTEM_ANTHROPIC_API_KEY: ${{ secrets.APEX_SYSTEM_ANTHROPIC_API_KEY }}
          APEX_SYSTEM_XAI_API_KEY: ${{ secrets.APEX_SYSTEM_XAI_API_KEY }}
          APEX_SYSTEM_OPENROUTER_API_KEY: ${{ secrets.APEX_SYSTEM_OPENROUTER_API_KEY }}
          APEX_SYSTEM_GROQ_API_KEY: ${{ secrets.APEX_SYSTEM_GROQ_API_KEY }}
          APEX_SYSTEM_MISTRAL_API_KEY: ${{ secrets.APEX_SYSTEM_MISTRAL_API_KEY }}
          APEX_SYSTEM_DEEPSEEK_API_KEY: ${{ secrets.APEX_SYSTEM_DEEPSEEK_API_KEY }}
          APEX_SYSTEM_QWEN_API_KEY: ${{ secrets.APEX_SYSTEM_QWEN_API_KEY }}
          APEX_SYSTEM_CUSTOM_OPENAI_API_KEY: ${{ secrets.APEX_SYSTEM_CUSTOM_OPENAI_API_KEY }}
          APEX_SYSTEM_CUSTOM_OPENAI_BASE_URL: ${{ secrets.APEX_SYSTEM_CUSTOM_OPENAI_BASE_URL }}
          APEX_SYSTEM_DEEPGRAM_API_KEY: ${{ secrets.APEX_SYSTEM_DEEPGRAM_API_KEY }}
          APEX_SYSTEM_ASSEMBLYAI_API_KEY: ${{ secrets.APEX_SYSTEM_ASSEMBLYAI_API_KEY }}
          APEX_SYSTEM_USDA_FDC_API_KEY: ${{ secrets.APEX_SYSTEM_USDA_FDC_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -PworkoutVectors=none --no-configuration-cache
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -f "$APK_SRC"
          cp "$APK_SRC" "$GITHUB_WORKSPACE/dist-apk/APEX-v2.5.8-release.apk"
          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Android-APK
          path: dist-apk/APEX-v2.5.8-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.5.8"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$GITHUB_WORKSPACE/dist-apk/APEX-v2.5.8-release.apk" --clobber
          else
            gh release create "$TAG" "$GITHUB_WORKSPACE/dist-apk/APEX-v2.5.8-release.apk" \
              --title "APEX v2.5.8 (Android APK)" \
              --notes "Signed Android release APK for **APEX** (\`com.apex.app\`) v2.5.8 — Animated Frosted-Blur Aurora Background + Rich Deep Charcoal-Slate glass theme, Crisp White text & Crimson Red buttons across all screens, APEX Tactical Emblem, smooth spring animations, 317 video-guided workouts, Dev: Yasuda | Gian."
          fi
